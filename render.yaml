services:
  - type: web
    name: glyanets
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    dockerCommand: uvicorn app:app --host 0.0.0.0 --port 10000
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Postgres снаружи: бесплатный Postgres Render удаляется через 30 дней, sqlite — при сне.
      - key: DATABASE_URL
        sync: false
      # С ним бот на вебхуке: спящий сервер будит сам Telegram. Адрес Render подставит сам.
      - key: WEBHOOK_SECRET
        generateValue: true
